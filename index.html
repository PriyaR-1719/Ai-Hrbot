<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Policy Chatbot 🤖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" class="bot-icon" alt="bot">
      <h2>HR Assistant Bot</h2>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="bot-message">Hello! 👋 I’m your HR assistant. How can I help you today?</div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your question here..." autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
